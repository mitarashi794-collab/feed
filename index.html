<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <title>マイフィード</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <h1>マイフィード</h1>
      <div class="actions">
        <button id="refreshBtn" class="icon-btn" type="button" aria-label="更新">⟳</button>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="情報源と設定">⚙</button>
      </div>
    </div>

    <input id="searchInput" type="search" placeholder="記事を検索" autocomplete="off" enterkeyhint="search">

    <div class="chips" id="categoryChips">
      <button type="button" class="chip active" data-cat="all">すべて</button>
      <button type="button" class="chip" data-cat="news">ニュース</button>
      <button type="button" class="chip" data-cat="blog">ブログ</button>
      <button type="button" class="chip" data-cat="video">動画</button>
      <button type="button" class="chip" data-cat="sns">SNS</button>
    </div>

    <div class="toolbar">
      <select id="sortSelect" aria-label="並べ替え">
        <option value="desc">新しい順</option>
        <option value="asc">古い順</option>
      </select>
      <button id="unreadToggle" class="toggle" type="button" aria-pressed="false">未読のみ</button>
      <button id="favToggle" class="toggle" type="button" aria-pressed="false">★ お気に入り</button>
    </div>

    <button id="statusBar" class="status" type="button"></button>
  </header>

  <main>
    <div id="timeline" class="timeline"></div>
    <p id="empty" class="empty" hidden>条件に合う記事がありません。</p>
    <button id="moreBtn" class="more" type="button" hidden>さらに表示</button>
  </main>

  <dialog id="settingsDialog">
    <div class="sheet-head">
      <h2>情報源と状態</h2>
      <button id="closeSettings" class="icon-btn" type="button" aria-label="閉じる">✕</button>
    </div>

    <section>
      <h3>取得状況</h3>
      <p id="metaInfo" class="muted"></p>
      <ul id="errorList" class="plain"></ul>
    </section>

    <section>
      <h3>情報源</h3>
      <ul id="sourceList" class="plain"></ul>
    </section>

    <section>
      <h3>情報源を追加</h3>
      <form id="addSourceForm" autocomplete="off">
        <input id="srcName" type="text" maxlength="40" placeholder="名前" required>
        <input id="srcUrl" type="url" placeholder="https://example.com/feed.xml" required>
        <select id="srcType" aria-label="種類">
          <option value="rss">RSS / Atom</option>
          <option value="youtube">YouTube</option>
          <option value="misskey">Misskey</option>
          <option value="html">HTML抽出</option>
        </select>
        <select id="srcCategory" aria-label="カテゴリ">
          <option value="news">ニュース</option>
          <option value="blog">ブログ</option>
          <option value="video">動画</option>
          <option value="sns">SNS</option>
        </select>
        <button type="submit" class="primary">追加</button>
        <p id="formMsg" class="muted" role="status"></p>
      </form>
      <button id="copySourcesBtn" class="secondary" type="button">追加分を sources.json 用にコピー</button>
      <p class="muted small">追加した情報源は、sources.json に書き足すと自動収集の対象になります（ステージ2）。</p>
    </section>

    <section>
      <h3>データ</h3>
      <button id="resetReadBtn" class="secondary" type="button">既読をリセット</button>
    </section>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
