name: update-feeds

on: { schedule: [{ cron: "17 * * * *" }], workflow_dispatch: { inputs: { force: { description: "更新間隔を無視して全て取得する（true or false）", required: false, default: "false" } } } }

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds
        env:
          FORCE_FETCH: ${{ github.event.inputs.force }}
        run: python scripts/fetch_feeds.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/state.json
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git commit -m "chore: update feed data"
          git pull --rebase
          git push
